version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bi_cometa
      POSTGRES_USER: bi_user
      POSTGRES_PASSWORD: bi_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      DB_URL: postgresql+psycopg2://bi_user:bi_password@db:5432/bi_cometa
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
